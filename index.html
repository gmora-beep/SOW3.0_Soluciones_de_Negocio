<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOW - Solicitud de Iniciativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-container"></div>
    <main>
        <h1>Bienvenido a Soluciones de Negocio</h1>
    </main>
<script>
fetch("components/header.html")
    .then(response => response.text())
    .then(data => {
        document
            .getElementById("header-container")
            .innerHTML = data;
        document
            .getElementById("menu-home")
            ?.classList.add("activo");
        const btnMenu =
            document.getElementById("btnMenu");
        if(btnMenu){
            btnMenu.addEventListener(
                "click",
                function(e){
                    e.preventDefault();
                    document
                        .getElementById("menuContenido")
                        ?.classList.toggle("hidden");
                    document
                        .querySelector(".menu-principal")
                        ?.classList.toggle("menu-colapsado");
                }
            );
        }
    });
document.addEventListener("click", function(e){
    const enlace = e.target.closest("a[href]");
    if(!enlace) return;
    const url = enlace.getAttribute("href");
    if(
        url.startsWith("#") ||
        url.startsWith("http")
    ){
        return;
    }
    e.preventDefault();
    document.body.classList.add("fade-out");
    setTimeout(() => {
        window.location.href = url;
    }, 250);
});

</script>
</body>
</html>
