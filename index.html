<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOW - Solicitud de Iniciativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family
</head>
<body>
    <div class="header">
        <div class="logo-circulo"></div>
        <div>
            <div class="titulo-header">
                Soluciones de Negocio | Formato SOW
            </div>
            <div class="subtitulo-header">
                Iniciativas de negocio
            </div>
        </div>
    </div>
<div class="sow-banner">
    <div class="sow-banner-left">
        <div class="sow-icon">
            C
        </div>
        <div>
            <div class="sow-banner-titulo">
                SOW - SOLICITUD DE INICIATIVA
            </div>
            <div class="sow-banner-subtitulo">
                Formulario para solicitante y PO
            </div>
        </div>
    </div>
    <div class="sow-fecha">
        <label>Fecha de solicitud</label>
        <input type="date">
    </div>
</div>
<div class="seccion-card">
    <div class="seccion-titulo">
        <div class="seccion-letra">
            A
        </div>
        <h2>INFORMACIÓN GENERAL</h2>
    </div>
    <div class="informacion-general">
        <div class="columna">
            <div class="campo">
                <label>Nombre de la iniciativa</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Área solicitante</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Sponsor (EPIC Owner)</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Línea de negocio</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>Objetivo estratégico</label>
                <input type="text">
            </div>
        </div>
        <div class="columna">
            <div class="campo">
                <label>Solicitante</label>
                <input type="text">
            </div>
            <div class="campo">
                <label>PO (apoyo en el llenado)</label>
                <input type="text">
            </div>
            <div class="campo tipo-iniciativa">
                <label>Tipo de iniciativa</label>
                <div class="opciones-tipo">
                <label class="opcion opcion-estrategica">
                    <span class="circulo"></span>
                    Estratégica
                </label>
                            <label class="opcion opcion-transformacion">
                    <span class="circulo"></span>
                    Transformación
                </label>
                            <label class="opcion opcion-regulatoria">
                    <span class="circulo"></span>
                    Regulatoria
                </label>   
            </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
