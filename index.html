<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOW - Solicitud de Iniciativa</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="header">  
        <img src="images/logo-soluciones.png"
             alt="Soluciones de Negocio"
             class="logo-header">    
        <div>
                  </div>    
            <div class="subtitulo-header">
                Iniciativas de negocio
            </div>
        </div>    
    </div>
<div class="sow-banner">
    <div class="sow-banner-left">
        <img src="images/sow-icon.png"
     alt="SOW"
     class="sow-icon-img">
        <div>
            <div class="sow-banner-titulo">
                SOW - SOLICITUD DE INICIATIVA
            </div>
            <div class="sow-banner-subtitulo">
                Formulario para solicitante y PO
            </div>
        </div>
    </div>
    <div class="sow-fecha">
        <label>Fecha de solicitud</label>
        <input type="date">
    </div>
</div>
<div class="seccion-card">
    <div class="seccion-titulo">
        <div class="seccion-letra">
            A
        </div>
        <h2>INFORMACIÓN GENERAL</h2>
    </div>
    <div class="informacion-general">
        <div class="columna">
            <div class="campo">
                <div class="campo-label">
            <span class="material-symbols-outlined icono">
                    edit_square
            </span>
            <label>Nombre de la iniciativa</label>
        </div>       
        <input type="text">        
    </div>

            <div class="campo">
                <div class="campo-label">
            <span class="material-symbols-outlined icono">
                apartment
            </span>
            <label>Área solicitante</label>
        </div>        
        <input type="text">        
    </div>

            <div class="campo">
            <div class="campo-label">
                <span class="material-symbols-outlined icono">
                    star
                </span>
                <label>Sponsor (EPIC Owner)</label>
            </div>
            <input type="text">        
        </div>
            
            <div class="campo">
            <div class="campo-label">
                <span class="material-symbols-outlined icono">
                    business_center
                </span>
                <label>Línea de negocio</label>
            </div>
            <input type="text">
        </div>
            
            <div class="campo">
            <div class="campo-label">
                <span class="material-symbols-outlined icono">
                    target
                </span>
                <label>Objetivo estratégico</label>
            </div>        
            <input type="text">        
        </div>
    </div>
    <div class="columna">
            <div class="campo">
            <div class="campo-label">
                <span class="material-symbols-outlined icono">
                    person
                </span>
                <label>Solicitante</label>
            </div>        
            <input type="text">        
        </div>
            
            <div class="campo">        
            <div class="campo-label">
                <span class="material-symbols-outlined icono">
                    person
                </span>
                <label>PO (apoyo en el llenado)</label>
            </div>        
            <input type="text">        
        </div>

            <div class="campo tipo-iniciativa">
                <div class="campo-label">
                    <span class="material-symbols-outlined icono">
                        flag
                    </span>
                    <label>Tipo de iniciativa</label>
                </div>
                <div class="opciones-tipo">
                    <label class="opcion opcion-estrategica">
                        <span>Estratégica</span>
                        <span class="circulo"></span>
                    </label>
                    <label class="opcion opcion-transformacion">
                        <span>Transformación</span>
                        <span class="circulo"></span>
                    </label>
                    <label class="opcion opcion-regulatoria">
                        <span>Regulatoria</span>
                        <span class="circulo"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
